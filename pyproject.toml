[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoflow-ide"
version = "0.8.0"
description = "An issue-based terminal IDE for AutoFlow"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["textual>=8.2"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]
# Browser control (b): the local server. browser-test adds Playwright for tests/test_browser_page.py (#86).
# Browser control needs Python 3.10 or later: aiohttp 3.14.5, the first release with no known advisory, needs it, and on
# Python 3.9 the extras install nothing rather than an affected release. Playwright 1.61 is the release whose
# Chromium (149, build 1228) the browser tests were run with (#86).
browser = ['aiohttp>=3.14.5,<4; python_version >= "3.10"']
browser-test = ["pytest", "pytest-asyncio", 'aiohttp>=3.14.5,<4; python_version >= "3.10"',
                'playwright>=1.61.0,<1.62; python_version >= "3.10"']

[project.scripts]
autoflow-ide = "autoflow_ide.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoflow_ide = ["*.tcss", "web/*.html", "web/*.js", "web/*.css", "web/xterm/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

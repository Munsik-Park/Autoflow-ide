name: test

# Only the tests of what the IDE uses from other tools run here: the output of the coordinator's
# status.py, VERSION and config.py, the files AutoFlow writes in a module run's output folder, of gh, and the tmux commands that move focus, open the coordination
# session and find and close its window. They run on recorded output, so they do not depend on timing, and they are what breaks when one
# of those tools changes (a coordinator rc, a gh release). The screen tests (tests/test_app.py) are not run
# here; a pull request runs the ones of what it changes. See "Tests" in README.md.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: pytest tests/test_runs.py tests/test_results.py tests/test_issues.py tests/test_focus.py tests/test_start.py tests/test_windows.py
